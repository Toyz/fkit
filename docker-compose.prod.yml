# fkit hub — deployment. Pulls a published image; the server needs no toolchain.
#
#   docker compose --env-file .env.prod -f docker-compose.prod.yml \
#     --profile bundled-db up -d
#
# Drop --profile bundled-db and set DATABASE_URL to use a database you already
# have. Settings are in hub.toml; only secrets come from .env.prod, because the
# environment overrides the file.
#
# The hub speaks plain HTTP on BIND_ADDR:HUB_PORT — point your proxy at it. It
# defaults to 127.0.0.1, so forgetting to set it means "local only" rather than
# "the whole internet". Whatever terminates TLS must pass WebSocket upgrades
# through: the sync protocol is WebSocket end to end, and a proxy that mangles
# Upgrade breaks push and clone while the web UI looks perfectly healthy.

name: fkit

services:
  postgres:
    image: postgres:17-alpine
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fkit}
      POSTGRES_DB: ${POSTGRES_DB:-fkit_hub}
      # Not `:?` — compose interpolates inactive profiles too, so a required
      # check here would break external-database deploys that never use it.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fkit} -d $${POSTGRES_DB:-fkit_hub}"]
      interval: 10s
      timeout: 3s
      retries: 20

  hub:
    image: ${FKIT_IMAGE:-ghcr.io/toyz/fkit-hub}:${FKIT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-fkit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fkit_hub}}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-fkit_hub=info,tower_http=warn}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HUB_PORT:-7500}:7500"
    volumes:
      - repodata:/var/lib/fkit/data
      # A path the hub checks on its own, so no flag is needed.
      - ./hub.toml:/etc/fkit/hub.toml:ro

volumes:
  pgdata:
  repodata:
