<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>fkit</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>%F0%9F%8C%B3</text></svg>" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <fkit-app>
      <!--
        The first frame. Until the module parses and upgrades <fkit-app> there
        is nothing here to draw, and the whole page used to arrive at once
        about 75ms in — the blank-then-everything flash.

        These are light-DOM children, so they stop being rendered the instant a
        shadow root attaches: the real header replaces this rather than having
        to be cleaned up. It is deliberately only the parts that never change,
        because anything conditional would be a guess that has to be corrected.
      -->
      <div class="boot" aria-hidden="true">
        <div class="boot-bar">
          <div class="boot-wrap">
            <span class="boot-brand"><span class="k">f</span>kit<span class="boot-tail">hub</span></span>
            <span class="boot-nav">Repositories</span>
          </div>
        </div>
      </div>
    </fkit-app>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
