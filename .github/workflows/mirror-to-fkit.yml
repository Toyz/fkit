# Mirror main into the fkit hub — fkit hosting its own source.
#
# One fkit commit per *git commit*, not per push. A push of five commits used to
# collapse into a single snapshot, which lost both the shape of the history and
# who wrote it: every commit came out authored by "fkit ci", seconds apart.
# Each git commit is now replayed in order, carrying its original author and its
# original timestamp.
#
# This still is not a re-encoded git graph — a merge's two parents become one
# linear step, and the fkit hashes are fkit's own. It is a faithful replay of
# what main looked like at each commit, in fkit's object model, with real diffs
# between them.
#
# Where it resumes from is written into the commit messages themselves: each one
# ends with `git <sha>`, and the newest such trailer in the mirror's log says
# what has already been replayed. There is no state kept anywhere else.
#
# Cloning first is what makes the chain work: committing into a fresh
# `fkit init` every run would produce a parentless commit the hub would refuse
# to fast forward onto.
#
# Secrets:
#   FKIT_REMOTE   wss://fkit.work/helba/fkit
#   FKIT_TOKEN    an fkit access token with write access to that repository
#
# The remote must be wss:// for anything crossing the public internet. The
# sync protocol carries the access token in its opening frame, so a ws:// URL
# to a public host hands that token to the network.
name: mirror to fkit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Two runs pushing snapshots at once would race for the branch tip and the
  # loser's push would be rejected. Newer wins; an intermediate snapshot of
  # main is worth nothing.
  group: mirror-to-fkit
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Replaying commit by commit needs the commits. A shallow checkout has
          # only the tip, and every run would look like a single change.
          fetch-depth: 0

      # The CLI comes out of the image we already publish rather than being
      # compiled here: it is then demonstrably the same binary the hub is
      # running against, and the step takes seconds instead of minutes.
      - name: Fetch the fkit CLI
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # The owner is spelled however the account is spelled, and a registry
          # reference has to be lowercase. `docker/metadata-action` does this
          # for the publishing side; here it is ours to do.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=ghcr.io/$owner/fkit-hub

          # `:latest` moves on a release, so it is the tag worth mirroring
          # against -- but it does not exist until the first tag is pushed, and
          # `:main` is then the only image published. Prefer the release, take
          # what is there.
          if docker pull -q "$repo:latest"; then
            image=$repo:latest
          else
            echo "no :latest published yet -- falling back to :main"
            image=$repo:main
            docker pull -q "$image"
          fi

          cid=$(docker create "$image")
          docker cp "$cid:/usr/local/bin/fkit" ./fkit-bin
          docker rm "$cid" >/dev/null
          sudo install -m 0755 ./fkit-bin /usr/local/bin/fkit
          rm -f ./fkit-bin

      - name: Replay main into fkit
        env:
          FKIT_TOKEN: ${{ secrets.FKIT_TOKEN }}
          FKIT_REMOTE: ${{ secrets.FKIT_REMOTE }}
        run: |
          set -euo pipefail
          test -n "${FKIT_REMOTE:-}" || { echo "FKIT_REMOTE is not set" >&2; exit 1; }
          case "$FKIT_REMOTE" in
            wss://*) ;;
            ws://127.0.0.1*|ws://localhost*) ;;
            ws://*) echo "refusing to send an access token over plain ws:// to a remote host" >&2
                    exit 1 ;;
          esac

          # Clone what the hub already has, so this run's commits have a parent.
          # A repository nobody has pushed to yet has nothing to clone, and
          # `fkit init` is then the right start.
          if fkit clone "$FKIT_REMOTE" mirror 2>/dev/null; then
            echo "cloned existing history"
          else
            echo "nothing to clone — starting from the beginning"
            mkdir -p mirror
            ( cd mirror && fkit init . )
          fi

          # Where we left off. The trailer is written by this job, so the newest
          # one in the log is the last git commit already mirrored.
          last=$( (cd mirror && fkit log 2>/dev/null) \
                  | grep -oE 'git [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true )

          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            range="$last..HEAD"
            echo "resuming after $last"
          else
            # First run, or the recorded commit is no longer in this history
            # (a force-push). Replaying everything is the only honest option:
            # picking up from the tip would silently skip whatever came between.
            range="HEAD"
            [ -n "$last" ] && echo "recorded commit $last is gone — replaying from the beginning"
            echo "no resume point — replaying the whole history"
          fi

          commits=$(git rev-list --reverse "$range")
          if [ -z "$commits" ]; then
            echo "nothing new since the last mirror"
            exit 0
          fi
          echo "replaying $(echo "$commits" | wc -l) commit(s)"

          cd mirror
          fkit remote "$FKIT_REMOTE"

          for sha in $commits; do
            # Replace the working tree wholesale, so deletions propagate. Only
            # .fkit survives. `git archive` gives the exact tree at that commit
            # without disturbing the checkout we are reading from.
            find . -mindepth 1 -maxdepth 1 ! -name .fkit -exec rm -rf {} +
            git -C .. archive "$sha" | tar -xf - -C .

            name=$(git -C .. log -1 --format=%an "$sha")
            email=$(git -C .. log -1 --format=%ae "$sha")
            when=$(git -C .. log -1 --format=%at "$sha")
            subject=$(git -C .. log -1 --format=%B "$sha")

            # A commit that only touched ignored paths leaves the tree
            # identical, and fkit refuses an empty commit. That is a skip, not
            # a failure — the next commit still gets its own entry.
            if fkit status | grep -q "working tree clean"; then
              echo "  skip  ${sha:0:10}  (no change fkit can see)"
              continue
            fi

            fkit commit \
              --author "$name <$email>" \
              --date "$when" \
              -m "$(printf '%s\n\ngit %s' "$subject" "$sha")" >/dev/null
            echo "  ok    ${sha:0:10}  $name"
          done

          fkit push
