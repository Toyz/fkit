# The checks that must pass before an image is worth building.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The same builder the image is compiled with, so a check passing here means
  # the toolchain that ships the release agreed. It carries clippy and rustfmt
  # already, and its host triple is the musl target, so the tests run against
  # the libc the binaries are actually shipped with.
  BUILDER: rust:1-alpine
  # A path on the runner's host — see the note in image.yml. The target
  # directory is deliberately not the one image.yml uses: these are different
  # profiles, and sharing it would only make the two jobs queue behind cargo's
  # lock.
  CACHE_DIR: /var/lib/fkit-ci

jobs:
  rust:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Test and lint
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -v "$CACHE_DIR/cargo:/cargo" \
            -v "$CACHE_DIR/target-check:/target" \
            -e CARGO_HOME=/cargo \
            -e CARGO_TARGET_DIR=/target \
            "$BUILDER" \
            sh -euc '
              cargo test --workspace
              cargo clippy --workspace --all-targets -- -D warnings
            '

  web:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
