# Build and publish the hub image, then mirror main into the fkit hub with it.
#
# Two jobs, in that order, and the order is the point: the mirror runs the fkit
# CLI taken out of the image the first job just published. They used to be
# separate workflows, which meant they started in the same second and the
# mirror finished about a hundred seconds before the image it wanted existed —
# so it always ran the *previous* commit's binary.
#
# The binaries are compiled natively on the runner rather than inside the
# Docker build, so cargo's incremental cache actually applies: a source-only
# change recompiles the workspace crates and nothing else. Building inside the
# image would start every run with a target directory holding dependencies and
# no workspace crates, and Docker's layer cache cannot help with a layer that
# changes whenever the source does.
#
# `Dockerfile.dist` then just copies the artifacts in. The self-contained
# `Dockerfile` still exists for `make image` and for anyone building from
# source with one command.
name: image

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      mirror:
        description: "Replay main into the fkit hub after building the image"
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/fkit-hub
  # Static, so the runtime image needs no libc beyond what Alpine ships.
  TARGET: x86_64-unknown-linux-musl

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # --- frontend ---------------------------------------------------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run build
        working-directory: web

      # --- binaries ---------------------------------------------------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # zstd is a C library built through cc, so the musl target needs a musl
      # C compiler. Without it the link fails only at the very end of a long
      # build, which is the worst place to find out.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
          # Share the cache between tag builds and main builds: they compile
          # the same crates, and a tag push should not start cold.
          shared-key: image

      # `redis-cache` is off by default because most servers should not use a
      # shared tier — but that is a decision for whoever runs the server, made
      # in hub.toml, and it cannot be made at all if the client is not in the
      # binary. Compiling it in costs a few pure-Rust crates and no C
      # dependency, so the published image can do either.
      - env:
          # The commit this build is of, handed in rather than read from the
          # checkout. The server uses it to find itself in its own mirror,
          # where every replayed commit carries a trailer naming the revision
          # it came from, and so to print which build it is running. Passed
          # explicitly because the image build has no repository in its context
          # at all, and a feature that quietly stops working when nobody is
          # watching is worse than one that was never there.
          FKIT_COMMIT: ${{ github.sha }}
        run: |
          cargo build --release --workspace \
            --features fkit-hub/redis-cache \
            --target ${{ env.TARGET }}

      - name: Assemble the build context
        run: |
          set -euo pipefail
          mkdir -p ctx/bin
          cp target/${{ env.TARGET }}/release/fkit \
             target/${{ env.TARGET }}/release/fkitd \
             target/${{ env.TARGET }}/release/fkit-hub ctx/bin/
          strip ctx/bin/*
          cp -r web/dist ctx/web
          cp Dockerfile.dist ctx/

          # A dynamically linked binary here would run on the runner and fail in
          # Alpine, so the assumption is checked rather than hoped for. The ELF
          # headers are asked directly -- is there an interpreter to load, is
          # there a library to find -- because file(1) words a static-pie binary
          # differently from one version to the next, and this has to mean the
          # same thing on whatever runner it lands on.
          for b in ctx/bin/*; do
            if readelf -lW "$b" | grep -q INTERP; then
              echo "$b wants an ELF interpreter:"; readelf -lW "$b"; exit 1
            fi
            if readelf -dW "$b" 2>/dev/null | grep -q NEEDED; then
              echo "$b needs a shared library:"; readelf -dW "$b"; exit 1
            fi
          done
          ls -lh ctx/bin

      # --- publish ----------------------------------------------------
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # From the permissions block above; no PAT to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          # A tag push publishes that version; every build moves :latest, so a
          # deployment that pins nothing tracks the newest image either way.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ctx
          file: ctx/Dockerfile.dist
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Mirror main into the fkit hub — fkit hosting its own source.
  #
  # One fkit commit per *git commit*, not per push. A push of five commits used
  # to collapse into a single snapshot, which lost both the shape of the history
  # and who wrote it: every commit came out authored by "fkit ci", seconds apart.
  # Each git commit is replayed in order, carrying its original author and its
  # original timestamp.
  #
  # This still is not a re-encoded git graph — a merge's two parents become one
  # linear step, and the fkit hashes are fkit's own. It is a faithful replay of
  # what main looked like at each commit, in fkit's object model, with real
  # diffs between them.
  #
  # Where it resumes from is written into the commit messages themselves: each
  # one ends with `git <sha>`, and the newest such trailer in the mirror's log
  # says what has already been replayed. No state is kept anywhere else.
  #
  # It lives in this workflow, and not its own, because it needs the image this
  # workflow publishes. As a separate workflow the two started in the same
  # second and the mirror finished about a hundred seconds before the image
  # existed — so it always ran with the *previous* commit's CLI, and any commit
  # that added a flag the mirror then used would fail once before healing.
  # `needs` makes the order a fact rather than a race.
  #
  # Secrets:
  #   FKIT_REMOTE   wss://fkit.work/helba/fkit
  #   FKIT_TOKEN    an fkit access token with write access to that repository
  #
  # The remote must be wss:// for anything crossing the public internet. The
  # sync protocol carries the access token in its opening frame, so a ws:// URL
  # to a public host hands that token to the network.
  mirror:
    needs: build
    # Only for main. A tag push publishes an image too, but the mirror follows
    # the branch, and replaying it again on every release would do nothing but
    # find there is nothing to do.
    #
    # A manual run can still skip it, which is what the `mirror` input is for:
    # when the protocol on this branch has moved ahead of what the deployed hub
    # answers, mirroring would open a conversation it cannot finish, and a
    # half-finished push is worse than a failed one -- it leaves objects whose
    # children never arrived, and the next attempt prunes at exactly those and
    # reports success having fixed nothing.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name != 'workflow_dispatch' || inputs.mirror)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      # Two runs pushing at once would race for the branch tip and the loser
      # would be rejected. Newer wins; an intermediate state of main is worth
      # nothing.
      group: mirror-to-fkit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Replaying commit by commit needs the commits. A shallow checkout has
          # only the tip, and every run would look like a single change.
          fetch-depth: 0

      # Taken from the image this run just published, so the binary doing the
      # mirroring is built from the very commit being mirrored. `:main` is what
      # the build step above pushed for this ref.
      - name: Fetch the fkit CLI
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # A registry reference has to be lowercase, and the owner is spelled
          # however the account is spelled. `docker/metadata-action` handles
          # this on the publishing side; here it is ours to do.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          image=ghcr.io/$owner/fkit-hub:main

          docker pull -q "$image"
          cid=$(docker create "$image")
          docker cp "$cid:/usr/local/bin/fkit" ./fkit-bin
          docker rm "$cid" >/dev/null
          sudo install -m 0755 ./fkit-bin /usr/local/bin/fkit
          rm -f ./fkit-bin
          fkit --help >/dev/null

      - name: Replay main into fkit
        env:
          FKIT_TOKEN: ${{ secrets.FKIT_TOKEN }}
          FKIT_REMOTE: ${{ secrets.FKIT_REMOTE }}
        run: |
          set -euo pipefail
          test -n "${FKIT_REMOTE:-}" || { echo "FKIT_REMOTE is not set" >&2; exit 1; }
          case "$FKIT_REMOTE" in
            wss://*) ;;
            ws://127.0.0.1*|ws://localhost*) ;;
            ws://*) echo "refusing to send an access token over plain ws:// to a remote host" >&2
                    exit 1 ;;
          esac

          # Clone what the hub already has, so this run's commits have a parent.
          # A repository nobody has pushed to yet has nothing to clone, and
          # `fkit init` is then the right start.
          if fkit clone "$FKIT_REMOTE" mirror 2>/dev/null; then
            echo "cloned existing history"
          else
            echo "nothing to clone — starting from the beginning"
            mkdir -p mirror
            ( cd mirror && fkit init . )
          fi

          # Where we left off. The trailer is written by this job, so the newest
          # one in the log is the last git commit already mirrored.
          last=$( (cd mirror && fkit log 2>/dev/null) \
                  | grep -oE 'git [0-9a-f]{40}' | head -1 | cut -d' ' -f2 || true )

          if [ -n "$last" ] && git cat-file -e "$last^{commit}" 2>/dev/null; then
            range="$last..HEAD"
            echo "resuming after $last"
          else
            # First run, or the recorded commit is no longer in this history
            # (a force-push). Replaying everything is the only honest option:
            # picking up from the tip would silently skip whatever came between.
            range="HEAD"
            [ -n "$last" ] && echo "recorded commit $last is gone — replaying from the beginning"
            echo "no resume point — replaying the whole history"
          fi

          commits=$(git rev-list --reverse "$range")
          if [ -z "$commits" ]; then
            echo "nothing new since the last mirror"
            exit 0
          fi
          echo "replaying $(echo "$commits" | wc -l) commit(s)"

          cd mirror
          fkit remote "$FKIT_REMOTE"

          for sha in $commits; do
            # Replace the working tree wholesale, so deletions propagate. Only
            # .fkit survives. `git archive` gives the exact tree at that commit
            # without disturbing the checkout we are reading from.
            find . -mindepth 1 -maxdepth 1 ! -name .fkit -exec rm -rf {} +
            git -C .. archive "$sha" | tar -xf - -C .

            name=$(git -C .. log -1 --format=%an "$sha")
            email=$(git -C .. log -1 --format=%ae "$sha")
            when=$(git -C .. log -1 --format=%at "$sha")
            subject=$(git -C .. log -1 --format=%B "$sha")

            # A commit that only touched ignored paths leaves the tree
            # identical, and fkit refuses an empty commit. That is a skip, not
            # a failure — the next commit still gets its own entry.
            if fkit status | grep -q "working tree clean"; then
              echo "  skip  ${sha:0:10}  (no change fkit can see)"
              continue
            fi

            fkit commit \
              --author "$name <$email>" \
              --date "$when" \
              -m "$(printf '%s\n\ngit %s' "$subject" "$sha")" >/dev/null
            echo "  ok    ${sha:0:10}  $name"
          done

          fkit push
